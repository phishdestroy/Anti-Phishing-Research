name: Dependency and application checks

on:
  push:
    branches: [main]
    paths: ['package*.json', '**/*.ts', '**/*.tsx', '.github/workflows/checks.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
